<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN | NEO-RUSSIA</title>
    <style>
        :root {
            --bg-black: #020205;
            --neon-blue: #00f2ff;
            --dark-blue: #003547;
            --cyber-pink: #ff0055;
            --text-main: #bdefff;
            --steel: rgba(190, 235, 255, 0.14);
            --panel: rgba(0, 12, 18, 0.72);
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Segoe UI', 'Consolas', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            background: rgba(0, 5, 10, 0.95);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--dark-blue);
            gap: 12px;
        }

        .top-info {
            display: flex;
            gap: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--neon-blue);
            flex-wrap: wrap;
            min-width: 0;
        }

        .top-info span {
            white-space: nowrap;
            opacity: 0.92;
        }

        .login-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 6px 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            flex: 0 0 auto;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .login-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        @media (max-width: 760px) {
            .top-bar {
                padding: 10px 14px;
                align-items: flex-start;
            }

            .top-info {
                gap: 10px 14px;
                font-size: 0.76rem;
                line-height: 1.25;
                flex: 1 1 auto;
            }

            .login-btn {
                padding: 6px 12px;
                font-size: 0.78rem;
            }
        }

        @media (max-width: 460px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .top-info {
                justify-content: space-between;
            }

            .top-info span:nth-child(1),
            .top-info span:nth-child(2) {
                display: none;
            }

            .login-btn {
                width: 100%;
                text-align: center;
            }
        }

        .banner {
            height: 200px;
            background:
                linear-gradient(45deg, rgba(2, 2, 5, 0.92), rgba(0, 53, 71, 0.45)),
                url('https://images.contentstack.io/v3/assets/bltb6530b2711d52415/blt56561f5139036c05/659ef3b603887c040a4fa20c/VALORANT_E8A1_Evori_Dreamwings_Banner.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 50px;
            border-bottom: 1px solid var(--dark-blue);
        }

        .banner h1 {
            font-size: 2.0rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-blue);
            margin: 0;
        }

        .banner p {
            margin: 0 0 8px 0;
            color: var(--cyber-pink);
            font-weight: bold;
        }

        .main {
            min-height: calc(100vh - 200px - 56px);
            display: grid;
            place-items: center;
            padding: 34px 18px 52px;
        }

        .panel {
            width: min(520px, 100%);
            background: var(--panel);
            border: 1px solid rgba(0, 242, 255, 0.16);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.14), inset 0 0 22px rgba(0, 242, 255, 0.06);
            backdrop-filter: blur(6px);
            padding: 22px 22px 18px;
            position: relative;
            overflow: hidden;
        }

        .panel::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.65), transparent) top/100% 2px no-repeat,
                linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.65), transparent) bottom/100% 2px no-repeat,
                radial-gradient(70% 12px at 50% 0%, rgba(0, 242, 255, 0.32), transparent 70%) top/100% 26px no-repeat,
                radial-gradient(70% 12px at 50% 100%, rgba(0, 242, 255, 0.32), transparent 70%) bottom/100% 26px no-repeat;
            opacity: 0.75;
        }

        .panel-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 18px;
        }

        .panel-header h2 {
            margin: 0;
            color: #fff;
            letter-spacing: 0.08em;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.25);
            font-size: 1.15rem;
        }

        .stamp {
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            color: rgba(0, 242, 255, 0.9);
            border: 1px dashed rgba(0, 242, 255, 0.35);
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.25);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.35);
            white-space: nowrap;
        }

        form {
            position: relative;
            z-index: 1;
        }

        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 14px;
        }

        label {
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            color: rgba(0, 242, 255, 0.92);
            letter-spacing: 0.08em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 12px;
            border: 1px solid rgba(0, 242, 255, 0.25);
            background: rgba(0, 0, 0, 0.35);
            color: var(--text-main);
            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: rgba(0, 242, 255, 0.75);
            box-shadow: 0 0 0 2px rgba(0, 242, 255, 0.12);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0 18px;
            flex-wrap: wrap;
        }

        .hint {
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            opacity: 0.85;
        }

        .hint b {
            color: var(--cyber-pink);
            font-weight: 700;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: rgba(0, 242, 255, 0.08);
            border: 1px solid rgba(0, 242, 255, 0.55);
            color: var(--neon-blue);
            padding: 12px 14px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 800;
            letter-spacing: 0.08em;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            backdrop-filter: blur(6px);
        }

        .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .btn-secondary {
            border-color: rgba(255, 0, 85, 0.45);
            color: rgba(255, 0, 85, 0.92);
            background: rgba(255, 0, 85, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 85, 0.92);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.75);
        }

        .links {
            margin-top: 14px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            opacity: 0.9;
        }

        .links a {
            color: rgba(0, 242, 255, 0.9);
            text-decoration: none;
            border-bottom: 1px dashed rgba(0, 242, 255, 0.35);
            padding-bottom: 2px;
        }

        .links a:hover {
            color: #fff;
            border-bottom-color: rgba(255, 0, 85, 0.55);
        }

        @media (max-width: 520px) {
            .banner { padding: 0 18px; height: 180px; }
            .actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="top-info">
        <span>[ SETTINGS ]</span>
        <span>[ PROFILE ]</span>
        <span>[ AUTH_CODE: <b style="color:var(--cyber-pink)">77-X92</b> ]</span>
    </div>
    <a class="login-btn" href="/">RETURN_MARKET</a>
</div>

<div class="banner">
    <div>
        <p>// SECURE ACCESS REQUIRED</p>
        <h1>CONNECT_ID</h1>
    </div>
</div>

<main class="main">
    <section class="panel" aria-label="login panel">
        <div class="panel-header">
            <h2>AUTH / SIGN IN</h2>
            <div class="stamp">NEO-RUSSIA / GATE</div>
        </div>

        <form method="post" action="/login">
            <div class="field">
                <label for="username">ID</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="ENTER YOUR ID" required>
            </div>

            <div class="field">
                <label for="password">PASSCODE</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <div class="row">
                <div class="hint">STATUS: <b>ENCRYPTED</b></div>
                <div class="hint">TRACE: <span style="color:rgba(0,242,255,0.92)">ON</span></div>
            </div>

            <div class="actions">
                <button class="btn" type="submit">CONNECT</button>
                <button class="btn btn-secondary" type="button" onclick="history.back()">ABORT</button>
            </div>
        </form>

        <div class="links">
            <a href="/">BACK TO MARKET</a>
            <a href="#" onclick="alert('아직 연결되지 않은 기능입니다.'); return false;">FORGOT ID/PASSCODE</a>
        </div>
    </section>
</main>

</body>
</html>
